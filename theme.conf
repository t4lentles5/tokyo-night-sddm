[General]

# Default / Fallback wallpaper (used if no dynamic Quickshell wallpaper is available)
Background="Backgrounds/win11.png"

# Display resolution for layout calculations
ScreenWidth="1920"
ScreenHeight="1080"

# Typography (fallback font family, overridden dynamically by Quickshell /var/tmp/sddm-theme/settings_prefs.json)
Font="Geist"
FontSize=""

# Color scheme fallbacks (overridden dynamically by Quickshell /var/tmp/sddm-theme/colorscheme.json)
MainColor="#7aa2f7"
AccentColor="#7aa2f7"
BackgroundColor="#16161e"

# Header greeting text (leave empty for dynamic greeting based on time of day)
HeaderText=""

# Clock and Date format
# HourFormat="hh:mm AP" for 12h or "HH:mm" for 24h
HourFormat="HH:mm"
DateFormat="ddd · dd MMM · yyyy"

# Interface behavior
ForceHideSystemButtons="false"
